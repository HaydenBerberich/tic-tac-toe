<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./style.css" rel="stylesheet">
</head>
<body>
    <div class="top">
        <h2 id="player-one-header">Player One</h2>
        <button id="new-game">New Game</button>
        <dialog id="get-players">
            <form method="dialog">
                <label for="player-one">Player One Name:</label>
                <input id="player-one" type="text">
                <label for="player-two">Player Two Name:</label>
                <input id="player-two" type="text">
                <button type="submit">Start Game</button>
            </form>
        </dialog>
        <h2 id="player-two-header">Player Two</h2>
    </div>
    <div class="board">
        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>
    </div>
    <div class="bottom">
        <h2 id="status"></h2>
    </div>
    <script src="./script.js"></script>
</body>
</html>
